<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Logic Grid Puzzles</title>
  <meta name="description" content="A new logic grid puzzle every day. Short stories, clean grids, no account needed.">
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fafaf7;
      color: #1b1b1e;
      text-align: center;
    }
    main { max-width: 520px; }
    .tick { display: inline-block; width: 28px; height: 4px; border-radius: 2px; background: #3457d5; margin-bottom: 16px; }
    h1 { font-size: 32px; line-height: 1.2; margin: 0 0 10px; }
    p { margin: 0 0 24px; color: #6a6a70; }
    a { color: #3457d5; }
    @media (prefers-color-scheme: dark) {
      body { background: #121214; color: #f1f1ee; }
      p { color: #9b9ba3; }
      a { color: #8aa2f2; }
      .tick { background: #8aa2f2; }
    }
  </style>
</head>
<body>
  <main>
    <span class="tick" aria-hidden="true"></span>
    <h1>Daily Logic Grid Puzzles</h1>
    <p>A new logic grid puzzle every day: a short story, a handful of clues, one clean grid to solve.</p>
    <a href="privacy.html">Privacy policy</a>
  </main>
</body>
</html>
